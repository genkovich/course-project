# GitHub-native release notes skeleton.
# When you click "Generate release notes" on a GitHub Release (or call the API),
# GitHub builds the notes from MERGED PULL REQUESTS, mapping each PR's label to
# one of the categories below. `*` is the catch-all.
#
# This is the deterministic skeleton: the platform groups merged PRs into a dry
# list (and gate 1 falls back to it when no agent notes exist). The agentic step
# (release.yml, gate 1) humanizes that list into a curated changelog + saved
# partner notes + the published GitHub Release.
changelog:
  exclude:
    labels:
      - chore
      - test
      - ci
  categories:
    - title: Нове
      labels: [feature, enhancement]
    - title: Виправлення
      labels: [bug, fix]
    - title: Інше
      labels: ["*"] # catch-all for everything else
