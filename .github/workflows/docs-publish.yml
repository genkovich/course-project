name: docs-publish
on:
  pull_request:
    types: [closed]

# GATE 2 — a human merged a docs/vX.Y.Z PR (the one gate 1 opened). That merge is
# the second human gate: only now does the user guide leave the repo. This is a
# TERMINAL node — it PUTs docs/user-guide/*.md to the Redmine wiki and pushes
# nothing back, so it cannot trigger anything downstream. It runs only on a real
# human merge of a docs/* branch carrying the gate:docs label — never on gate 1's
# own GITHUB_TOKEN pushes (those do not fire workflows).
jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'docs/') &&
      contains(github.event.pull_request.labels.*.name, 'gate:docs')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REDMINE_URL: ${{ secrets.REDMINE_URL }}
      REDMINE_API_KEY: ${{ secrets.REDMINE_API_KEY }}
      REDMINE_PROJECT: ${{ secrets.REDMINE_PROJECT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Guard — Redmine secrets present
        id: guard
        run: |
          if [[ -z "$REDMINE_URL" || -z "$REDMINE_API_KEY" || -z "$REDMINE_PROJECT" ]]; then
            echo "::notice::REDMINE_URL / REDMINE_API_KEY / REDMINE_PROJECT not set — skipping publish"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the user guide to the Redmine wiki (REST PUT)
        if: steps.guard.outputs.ok == 'true'
        run: |
          shopt -s nullglob
          pages=(docs/user-guide/*.md)
          if [[ ${#pages[@]} -eq 0 ]]; then
            echo "::notice::no docs/user-guide/*.md to publish"
            exit 0
          fi
          for f in "${pages[@]}"; do
            page="$(basename "$f" .md)"
            # jq -Rs reads the whole file as one JSON string — safe for any markdown.
            code="$(jq -Rs '{wiki_page:{text:.}}' "$f" \
              | curl -sS -o /dev/null -w "%{http_code}" -X PUT \
                  -H "Content-Type: application/json" \
                  -H "X-Redmine-API-Key: ${REDMINE_API_KEY}" \
                  --data-binary @- \
                  "${REDMINE_URL}/projects/${REDMINE_PROJECT}/wiki/${page}.json")"
            echo "→ ${page}: HTTP ${code}"
          done
